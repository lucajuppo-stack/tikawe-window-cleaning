{% extends "layout.html" %}

{% block title %}Kirjaudu – Ikkunanpesujen seuranta{% endblock %}

{% block content %}
<h1>Kirjaudu sisään</h1>

<form class="stacked-form" action="/login" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">

  <label for="username">Tunnus</label>
  <input type="text" id="username" name="username" maxlength="20" required
         value="{{ username }}">

  <label for="password">Salasana</label>
  <input type="password" id="password" name="password" maxlength="100"
         required>

  <button type="submit">Kirjaudu</button>
</form>

<p class="lead">Eikö sinulla ole tunnusta?
  <a href="/register">Luo tunnus</a>.</p>
{% endblock %}
